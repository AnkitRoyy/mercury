# Watchdog Monitor Parameters
# Consolidated configuration for all monitoring nodes
health:
  ros__parameters:
    # How often to check system health (seconds)
    check_interval: 0.5
    # How long a topic can be silent before alerting (seconds)
    topic_timeout: 5.0
    # Expected nodes for this workspace
    expected_nodes: [
      "/behavior_server",
      "/bt_navigator",
      "/controller_manager",
      "/controller_server",
      "/diff_drive_controller",
      "/ekf_filter_node",
      "/global_costmap/global_costmap",
      "/joint_state_broadcaster",
      "/lane_costmap",
      "/lifecycle_manager_localization",
      "/lifecycle_manager_navigation",
      "/local_costmap/local_costmap",
      "/planner_server",
      "/pothole_costmap",
      "/robot_state_publisher",
      "/ros_gz_bridge",
      "/slam_toolbox",
      "/turret",
      "/twist_to_stamped"
    ]
    # Critical nodes (must be running)
    critical_nodes: [
      "/robot_state_publisher",
      "/ekf_filter_node",
      "/slam_toolbox",
      "/lifecycle_manager_localization",
      "/planner_server",
      "/controller_server",
      "/bt_navigator",
      "/behavior_server",
      "/lifecycle_manager_navigation",
      "/diff_drive_controller",
      "/joint_state_broadcaster",
      "/lane_costmap"
    ]
    # Topics to monitor for liveness
    monitored_topics: [
      "/diff_drive_controller/odom",
      "/scan",
      "/imu"
    ]
    # TF frame pairs to check
    tf_pairs: [
      "odom->base_link",
      "map->odom",
      "base_link->laser_link"
    ]

waypoints:
  ros__parameters:
    # Waypoints in map/world frame coordinates [x1, y1, x2, y2, ...]
    # HOME (4th waypoint) is appended at runtime by mission_setup.py
    waypoints: [15.57, -35.36, 1.59, -35.37, -11.21, -35.05]
    waypoint_names: ["WP-1", "WP-2", "WP-3"]
    # Arrival detection radius (metres)
    arrival_radius: 2.0
    # How often to publish status summary (seconds)
    status_interval: 0.5
    # Odometry topic
    odom_topic: "/diff_drive_controller/odom"
    # Frames used for live map->odom TF lookup (replaces static spawn_x/y/yaw)
    map_frame: "map"
    odom_frame: "odom"

dashboard:
  ros__parameters:
    # Refresh rate (Hz)
    refresh_rate: 5.0