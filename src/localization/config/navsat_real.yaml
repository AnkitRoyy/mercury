navsat_transform_node:
  ros__parameters:
    use_sim_time: false

    frequency: 10.0
    delay: 3.0

    # ── Datum: Initial reference point [latitude, longitude, yaw_offset_radians]
    wait_for_datum: true
    datum: [28.75305660, 77.11772623, -0.3141592653589793]

    magnetic_declination_radians: 0.0
    yaw_offset: 0.0

    zero_altitude: true              # ignore GPS altitude (flat outdoor field)
    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false
    publish_filtered_gps: false

    # Use the local EKF's fused heading (from gyro integration), 
    # since RealSense D455 IMU does not have a magnetic compass.
    use_odometry_yaw: true
    use_local_cartesian: false
