global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5

      rolling_window: false
      always_send_full_costmap: true

      width:      70
      height:     70
      resolution: 0.10
      origin_x:  -35.0
      origin_y:  -35.0

      footprint: "[[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]"
      footprint_padding: 0.02

      # lane_layer and pothole_layer removed for simulation —
      # those topics only exist when real perception nodes are running.
      # Re-add them for real robot deployment.
      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: LaserScan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          obstacle_min_range: 0.2
          obstacle_max_range: 8.0
          clearing: True
          marking: True
          raytrace_min_range: 0.10
          raytrace_max_range: 8.5
          inf_is_valid: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 0.5