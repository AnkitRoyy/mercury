local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05

      # Bot assumed 80x80 cm (0.80m x 0.80m) -> half-extents ±0.40m
      # Circumscribed radius ≈ 0.57m. Padding 0.03m gives 86x86 cm effective safety envelope.
      footprint: "[[0.40, 0.40], [0.40, -0.40], [-0.40, -0.40], [-0.40, 0.40]]"
      footprint_padding: 0.03

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: LaserScan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          obstacle_min_range: 0.2
          obstacle_max_range: 5.0       # increased from 3.5 → marks obstacles earlier
          observation_persistence: 0.2
          clearing: True
          marking: True
          raytrace_min_range: 0.10
          raytrace_max_range: 5.5       # slightly beyond obstacle_max_range
          inf_is_valid: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70          # 70cm: safely exceeds 80x80cm circumscribed radius (57cm)
        cost_scaling_factor: 2.8        # smooth gradient steers 80x80cm robot clear of obstacles
