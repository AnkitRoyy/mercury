planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.35
      stateful: True

    FollowPath:
      plugin: "control/StanleyController"

      # ── Stanley core ──────────────────────────────────────────────────
      k_stanley:      0.5
      k_soft:         3.0
      speed_mps:      1.0
      max_steer_deg:  30.0

      # ── forward obstacle ──────────────────────────────────────────────
      stop_dist:      0.5     # hard stop if obstacle closer than this (m)
      slowdown_dist:  1.5     # start braking at this distance (m)
      min_speed:      0.25    # slowest speed before hard stop (m/s)

      # ── lateral obstacle detection ────────────────────────────────────
      lateral_offset: 0.4    # how far left/right to probe costmap (m)
      sample_dist:    1.0    # how far ahead to probe (m)
      nudge_weight:   0.5    # kept for compat, not used in blend logic

      # ── A* blend ──────────────────────────────────────────────────────
      # obstacle_blend_threshold: bias magnitude at which A* weight = 1.0
      # Lower  → A* takes over sooner / more aggressively
      # Higher → lane dominates longer before A* kicks in
      # Recommended range: 0.15 – 0.40
      obstacle_blend_threshold: 0.25

      # ── costmap warmup ────────────────────────────────────────────────
      # Extra blocking sleep in activate() so costmap gets its first scan
      # before the controller starts commanding (ms).
      # Set to 0 to skip the sleep and rely purely on isCurrent() guard.
      # Increase on slow hardware or if lidar takes time to start publishing.
      costmap_warmup_ms: 500

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency:  20.0   # higher = costmap builds faster on startup
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      always_send_full_costmap: true   # don't wait for delta on first publish
      transform_tolerance: 0.5        # looser TF tolerance during startup
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0