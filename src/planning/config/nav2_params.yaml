planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 5.0        # ↑ was 2.0 — A* strongly avoids inflated cells
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.35
      stateful: True

    FollowPath:
      plugin: "control/StanleyController"

      # ── Stanley core ──────────────────────────────────────────────────
      k_stanley:      0.5
      k_soft:         3.0
      speed_mps:      1.0
      max_steer_deg:  30.0

      # ── forward obstacle ──────────────────────────────────────────────
      stop_dist:      0.5
      slowdown_dist:  3.0
      min_speed:      0.25

      # ── lateral lookahead obstacle detection ──────────────────────────
      # The controller samples N slices from near → far ahead of the robot.
      # Each slice is weighted by distance so far threats dominate →
      # steering starts BEFORE the robot reaches the obstacle cloud.
      lateral_offset:   0.8    # how wide left/right to probe (m)
      sample_dist_near: 1.0    # closest slice (m)
      sample_dist_far:  6.0    # furthest slice (m) — increase to react earlier
      sample_slices:    6      # number of slices between near and far

      nudge_weight:   0.5      # kept for compat, unused

      # ── A* blend ──────────────────────────────────────────────────────
      obstacle_blend_threshold: 0.05   # lower = reacts sooner to far obstacles

      # ── costmap warmup ────────────────────────────────────────────────
      costmap_warmup_ms: 3000
      controller_frequency: 20.0 
      

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency:  9.0
      publish_frequency: 9.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8                        
      height: 8
      resolution: 0.05
      always_send_full_costmap: true
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
          observation_persistence: 1.0
          expected_update_rate: 8.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.2
        cost_scaling_factor: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 9.0
      publish_frequency: 9.0
      global_frame: map
      robot_base_frame: base_link
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
          observation_persistence: 0.5
          expected_update_rate: 8.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 4.0          # ↑ bigger bubble on global so A* routes wide
        cost_scaling_factor: 0.9       # ↓ gentler falloff = wider avoidance arc