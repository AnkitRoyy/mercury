# Turret Vision Parameters
# All parameters consolidated in one file

recognition:
  ros__parameters:
    similarity_threshold: 0.35
    detection_size: 320

scanner:
  ros__parameters:
    h_positions_deg: [-120.0, -80.0, -40.0, 0.0, 40.0, 80.0, 120.0]
    v_positions_deg: [0.0, 20.0, 40.0]
  
    settle_time_sec: 0.5
    hold_time_sec: 0.3
    fine_tune_px_tol: 20.0
    fine_tune_gain_h: 0.05
    fine_tune_gain_v: 0.05
    fine_tune_timeout: 5.0
    laser_on_time_sec: 3.0

turret:
  ros__parameters:
    # For real hardware (Arduino/ESP32 over serial)
    serial_port: "/dev/ttyACM0"
    baud_rate: 115200
    pan_center: 0
    pan_scale: 1.0
    tilt_center: 0
    tilt_scale: 1.0
    # Auto-detects simulation if Gazebo bridge is available
    # Set dry_run: true to only log commands (no serial)
    dry_run: false

trigger:
  ros__parameters:
    trigger_waypoint_name: "WP-2"
    trigger_waypoint_index: 2
    hard_timeout_sec: 55.0
    stop_vehicle_on_trigger: true
    cmd_vel_topic: "/cmd_vel"